<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Hide the notice by default (for laptops/desktops) */
        .experience-notice {
            display: none;
            width: 100%;
            text-align: center;
            padding: 12px 0;
            font-size: 0.85rem;
            color: #444;
            background: #fffbe6; /* Light yellow warning vibe */
            border-bottom: 1px solid #ffe58f;
            font-family: sans-serif;
            position: relative;
            z-index: 1000;
        }

        /* Only show the notice on screens smaller than 768px (phones/tablets) */
        @media only screen and (max-width: 768px) {
            .experience-notice {
                display: block;
            }
        }
    </style>
</head>
<body>
    <!-- This will only be visible on mobile -->
    <div class="experience-notice">
        💻 For the best experience, use a laptop
    </div>

    <div class="cursor"></div>
    <div class="container">
        <h1>Happy Birthday Beato 🎉💛</h1>
        <div class="greeting"></div>
        <button class="cta-button">Surprise💕</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
